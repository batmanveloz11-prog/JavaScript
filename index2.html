<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>MI PRIMERA VEZ CON JAVASCRIPT</title> 
</head>
<body>
    <nav class="navbar bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="index.html">
                <img src="img/Cecytem-logojpg.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                Prácticas JavaScript
            </a>
        </div>
    </nav>

    <div class="container p-4 bg-info mt-5 card">
        <div class="row">
            <h1>Área del Triángulo</h1>

            <table class="table table-borderless" style="width: 100%;">
                <tr>
                    <td>
                        <h3>Base</h3>
                        <input type="range" id="base" min="1" max="100" value="1">
                        <span id="vb">1</span><br><br>

                        <h3>Altura</h3>
                        <input type="range" id="altura" min="1" max="100" value="1">
                        <span id="va">1</span><br><br>

                        <button id="reset" class="btn btn-secondary">Reset</button>
                    </td>
                    <td class="align-middle text-center">
                        <h1>Area</h1>
                        <h2 id="area">0</h2> 
                    </td>
                </tr>
            </table>
        </div>
    </div>

    <script src="js/sweetalert2.all.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/2app.js"></script>
</body>
</html>
