<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>MI PRIMERA VEZ CON JAVASCRIPT</title> 
</head>
<body>
    <nav class="navbar fg-2 bg-primary">
            <a class="navbar-brand" href="menu.html">
                <img src="img/Cecytem-logojpg.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                TIENDITA
            </a>
    </nav>
    <div class="container p-4 bg-inverse mt-5 card">
        
            <h1 class="text-center fg-black">Tiendita</h1>
            <div class="d-flex justify-content-end">
                <button class="btn-subtle theme-info w-25" data-bs-toggle="dialog" data-bs-target="#addProducto"><i class="bi bi-person-fill-add me-1"></i>Agregar</button>
            </div>
            

        <table class="table table-striped table-hover mt-3">
                <tr class="text-center">
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Action</th>
                </tr>
                <tbody id="productos">

                </tbody>
        </table>
    
        <dialog class="dialog" id="addProducto">
        <div class="dialog-header">
            <h1 class="dialog-title fg-black">Agregar Producto</h1>
            <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
        </div>
        <div class="dialog-body">
            <h3>Nombre</h3>
            <input type="text" id="nombre" class="form-control"><br>            
            <h3>Precio</h3>
            <input type="text" id="precio" class="form-control"><br>
        </div>
        <div class="dialog-footer">
            <button type="button" class="btn-solid theme-danger" data-bs-dismiss="dialog"><i class="bi bi-x-circle"></i>Cancelar</button>
            <button type="button" class="btn-solid theme-success" id="btnSave"><i class="bi bi-bookmark-check-fill"></i>Guardar</button>
        </div>
        </dialog>


        <dialog class="dialog" id="editProducto">
        <div class="dialog-header">
            <h1 class="dialog-title fg-black">Editar Producto</h1>
            <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
        </div>
        <div class="dialog-body">
            <h3>Nombre</h3>
            <input type="text" id="nombree" class="form-control"><br>            
            <h3>Precio</h3>
            <input type="text" id="precioe" class="form-control"><br>
        </div>
        <div class="dialog-footer">
            <input type="hidden" name="posicion" id="posicion">
            <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog"><i class="bi bi-x-circle"></i>Cancelar</button>
            <button type="button" class="btn-solid theme-primary" id="btnEdit"><i class="bi bi-bookmark-check-fill"></i>Guardar</button>
        </div>
        </dialog>
    </div>
    <script src="js/sweetalert2.all.min.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="js/tiendita.js"></script>
</body>
</html>
