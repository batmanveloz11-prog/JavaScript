<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>MI PRIMERA VEZ CON JAVASCRIPT</title> 
</head>
<body>
    <nav class="navbar fg-2 bg-primary">
            <a class="navbar-brand" href="index.html">
                <img src="img/Cecytem-logojpg.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                TIENDITA
            </a>
    </nav>
    <div class="container p-4 bg-inverse mt-5 card">
        
            <h1 class="text-center fg-black">Tiendita</h1>
            <button class="btn-solid theme-danger w-25" data-bs-toggle="dialog" data-bs-target="#addProducto"><i class="bi bi-person-fill-add me-1"></i>Agregar</button>

        <table class="table table-striped table-hover mt-3">
            <thead>
                <tr class="text-center">
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th>Importe</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </tbody>
        </table>
    
        <dialog class="dialog" id="addProducto">
        <div class="dialog-header">
            <h1 class="dialog-title fg-black">Agregar Producto</h1>
            <button class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
        </div>
        <div class="dialog-body">
            <h3>Nombre</h3>
            <input type="text" id="nombre" class="form-control"><br>            
            <h3>Precio</h3>
            <input type="text" id="precio" class="form-control"><br>
        </div>
        <div class="dialog-footer">
            <button type="button" class="btn-solid theme-secondary" data-bs-dismiss="dialog"><i class="bi bi-x-circle"></i>Cancelar</button>
            <button type="button" class="btn-solid theme-primary" id="btnSave"><i class="bi bi-bookmark-check-fill"></i>Guardar</button>
        </div>
        </dialog>
    </div>
    <script src="js/sweetalert2.all.min.js"></script>
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
    <script src="js/tiendita.js"></script>
</body>
</html>
